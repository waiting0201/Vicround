# 後端 API 的建置、測試與部署。
#
# 部署目標：Function App `func-vicround-prod`（Flex Consumption, .NET 10 isolated）。
# 認證走 GitHub OIDC（Entra 應用程式 `github-vicround-deploy`），**GitHub 不存任何長期憑證**。
name: api

on:
  push:
    branches: [master, main]
    paths:
      - 'Api/**'
      - 'tests/**'
      - 'global.json'
      - 'Directory.Build.props'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'Api/**'
      - 'tests/**'
  workflow_dispatch:

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

# OIDC 換 token 需要 id-token: write；其餘維持唯讀。
permissions:
  id-token: write
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  OUTPUT_PATH: ${{ github.workspace }}/output
  FUNCTION_APP: func-vicround-prod
  RESOURCE_GROUP: VicRoundUS
  SQL_SERVER: vicround-sql-prod

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Directory.Build.props 設了 TreatWarningsAsErrors，所以這一步同時是品質閘。
      - name: Build
        run: dotnet build VicRound.slnx -c Release --nologo

      # tests/Api.Tests 把 docs/database.md 的全域慣例寫成守門測試：
      # 新增實體時漏掉 slug 索引、翻譯表 PK、enum 型別等，會在這裡被擋下。
      - name: Test
        run: dotnet test VicRound.slnx -c Release --no-build --nologo

      - name: Publish
        run: dotnet publish Api/VicRound.Api.csproj -c Release -o ${{ env.OUTPUT_PATH }} --nologo

      # local.settings.json 設了 CopyToPublishDirectory=Never，這裡再確認一次：
      # 它含連線字串與 JWT 簽章金鑰，跟著產物上去等於把密鑰放進伺服器的檔案系統。
      - name: Assert no local settings in output
        run: |
          if [ -f "${{ env.OUTPUT_PATH }}/local.settings.json" ]; then
            echo "::error::local.settings.json 出現在部署產物中，請檢查 csproj 的 CopyToPublishDirectory。"
            exit 1
          fi

      # migration 與 EF 模型不同步是最容易漏掉的一種——程式碼改了實體卻忘了 add migration，
      # build 與測試都會過，但部署後 schema 對不上。
      - name: Assert migrations are up to date
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.3
          export PATH="$PATH:$HOME/.dotnet/tools"
          output=$(dotnet ef migrations has-pending-model-changes -p Api -s Api 2>&1) || true
          echo "$output"
          if echo "$output" | grep -q "Changes have been made"; then
            echo "::error::EF 模型與 migration 不同步，請執行 dotnet ef migrations add <Name> -p Api -s Api。"
            exit 1
          fi

      # 部署要用的產物。測試與防呆都過了才會走到這裡。
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: api
          path: ${{ env.OUTPUT_PATH }}
          retention-days: 3
          # isolated worker 的產物含 `.azurefunctions/`，而 upload-artifact 預設會把
          # 點開頭的檔案丟掉——少了它，部署會以「找不到 .azurefunctions」失敗。
          include-hidden-files: true

  deploy:
    needs: build_and_test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: api
          path: ${{ env.OUTPUT_PATH }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Migration 是**明確的、可看見的一步**（docs/azure-deployment.md）——
      # 絕不在 Function 啟動時自動跑，否則多個執行個體會同時改 schema。
      #
      # SQL 防火牆只開「允許 Azure 服務」，因此臨時放行這台 runner 的 IP，跑完立刻收回。
      # 連線字串不進 GitHub Secrets：用剛換到的 Azure 身分現場向 Function App 要，
      # 它本來就是唯一的存放處（docs/azure-deployment.md 的「Configuration & secrets」）。
      - name: Apply migrations
        run: |
          VICROUND_SQL_CONNECTION=$(az functionapp config appsettings list \
            -n "$FUNCTION_APP" -g "$RESOURCE_GROUP" \
            --query "[?name=='ConnectionStrings__SqlDatabase'].value" -o tsv)
          echo "::add-mask::$VICROUND_SQL_CONNECTION"
          export VICROUND_SQL_CONNECTION

          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "::add-mask::$RUNNER_IP"
          az sql server firewall-rule create -g "$RESOURCE_GROUP" -s "$SQL_SERVER" \
            -n "gh-runner-${{ github.run_id }}" --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP" -o none
          trap 'az sql server firewall-rule delete -g "$RESOURCE_GROUP" -s "$SQL_SERVER" -n "gh-runner-${{ github.run_id }}" -o none || true' EXIT

          dotnet tool install --global dotnet-ef --version 10.0.3
          export PATH="$PATH:$HOME/.dotnet/tools"

          # deploy job 只 checkout 原始碼（產物是 build job 傳過來的），
          # 而 `dotnet ef` 需要能載入 DbContext，因此得先自己建一次。
          # 明確 build 而不是讓 ef 隱含建：build 失敗時錯誤才看得見。
          dotnet build Api/VicRound.Api.csproj -c Release --nologo
          dotnet ef database update -p Api -s Api --configuration Release --no-build

      - name: Deploy to Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP }}
          package: ${{ env.OUTPUT_PATH }}
          sku: flexconsumption

      # 部署完就實際打一次 —— 「部署成功」不等於「跑得起來」。
      - name: Smoke test
        run: |
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' "https://${FUNCTION_APP}.azurewebsites.net/api/v1/health" || true)
            echo "attempt $attempt -> $code"
            if [ "$code" = "200" ]; then cat /tmp/health.json; exit 0; fi
            sleep 15
          done
          echo "::error::health 端點在部署後沒有回 200。"
          exit 1
