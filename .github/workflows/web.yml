# 前台（Next.js hybrid SSR）與後台 SPA 的建置與部署。
#
# 目標：Static Web Apps `stapp-vicround-prod`（Free 方案）。後台 SPA 先 build 進
# `apps/web/public/admin`，再 build 前台 —— 兩者是同一個部署單位（docs/architecture.md）。
name: web

on:
  push:
    branches: [master, main]
    paths:
      - 'apps/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'apps/**'
  workflow_dispatch:

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: '22'
  RESOURCE_GROUP: VicRoundUS
  STATIC_WEB_APP: stapp-vicround-prod

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # `node-linker=hoisted`：pnpm 預設的符號連結版 node_modules **搬不動** ——
      # standalone 產物裡只會留下指向 .pnpm store 的連結，換一台機器就 MODULE_NOT_FOUND。
      # 只有 CI 這樣裝；本機開發維持 pnpm 預設。
      - name: Install
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: Lint
        run: pnpm lint

      # 內容語言檢查：擋輸入法誤植（西里爾／韓文）與英文欄位混入中文。
      - name: Content language check
        run: node scripts/check-content-language.mjs

      # build 期間會呼叫 Content API 預先產生頁面，因此指向正式後端。
      #
      # `NEXT_PUBLIC_SITE_URL` 在 build 時就被內嵌，而它同時決定 robots.txt 要不要開放索引
      # （`lib/site.ts` 的 IS_PRODUCTION_SITE）。目前指向 SWA 的預設網域 → 整站 Disallow，
      # 綁上 www.vicround.com 之後把 repo 變數 SITE_URL 改掉即可，不必動程式。
      - name: Build
        env:
          API_BASE: https://func-vicround-prod.azurewebsites.net/api/v1
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
        run: pnpm build

      # 組出要上傳的資料夾。三件事：
      # 1. `output: 'standalone'` 不會複製 static 與 public，得自己搬（Next.js 的已知行為）
      # 2. monorepo 的 standalone 會把應用巢狀在 apps/web/ 底下，而 SWA 期待應用就在根，
      #    因此攤平
      # 3. 攤平後大小約 80MB，遠低於 SWA Free 的 250MB 上限
      - name: Assemble deployment folder
        run: |
          rm -rf deploy && mkdir -p deploy
          cp -R apps/web/.next/standalone/. deploy/
          mv deploy/apps/web/.next deploy/.next
          mv deploy/apps/web/server.js deploy/server.js
          mv deploy/apps/web/package.json deploy/package.json
          [ -d deploy/apps/web/messages ] && mv deploy/apps/web/messages deploy/messages || true
          [ -d deploy/apps/web/node_modules ] && cp -R deploy/apps/web/node_modules/. deploy/node_modules/ || true
          rm -rf deploy/apps
          cp -R apps/web/.next/static deploy/.next/static
          cp -R apps/web/public deploy/public
          test -f deploy/public/.swa/health.html || { echo "::error::缺少 .swa/health.html，SWA 的 warm-up 會逾時。"; exit 1; }
          du -sh deploy

      - name: Azure login (OIDC)
        if: github.event_name != 'pull_request'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 部署 token 現拿現用：GitHub 這一側不留任何長期憑證。
      - name: Get SWA deployment token
        if: github.event_name != 'pull_request'
        run: |
          TOKEN=$(az staticwebapp secrets list -n "$STATIC_WEB_APP" -g "$RESOURCE_GROUP" --query "properties.apiKey" -o tsv)
          echo "::add-mask::$TOKEN"
          echo "SWA_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Deploy to Static Web Apps
        if: github.event_name != 'pull_request'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: upload
          app_location: deploy
          output_location: ''
          skip_app_build: true
          skip_api_build: true

      - name: Smoke test
        if: github.event_name != 'pull_request'
        run: |
          HOST=$(az staticwebapp show -n "$STATIC_WEB_APP" -g "$RESOURCE_GROUP" --query defaultHostname -o tsv)
          for attempt in 1 2 3 4 5 6 7 8; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$HOST/en" || true)
            echo "attempt $attempt -> $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "::error::/en 在部署後沒有回 200。"
          exit 1
